[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "octroi"
version = "0.1.0"
description = "Toll gates for HTTP routes: return a 402, verify the payment, serve the 200."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Daniel", email = "hello@danield.dev" }]
keywords = ["x402", "payments", "402", "agents", "usdc"]
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
fastapi = ["fastapi>=0.100", "httpx>=0.24"]
dev = ["pytest>=7", "pytest-asyncio>=0.21", "fastapi>=0.100", "httpx>=0.24"]

[tool.hatch.build.targets.wheel]
packages = ["src/octroi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[project.urls]
Homepage = "https://github.com/octroihq/octroi"
Repository = "https://github.com/octroihq/octroi"
Issues = "https://github.com/octroihq/octroi/issues"
