name: CI

# Every check here is hermetic: no faucet, no live facilitator, no network.
# A red build must always mean "we broke something", never "the testnet is
# having a day". The live run lives in nightly.yml.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r build
      - run: pnpm -r test
      - name: golden files are unchanged
        # A protocol change must be a deliberate, reviewed diff — never an
        # accident that a test run quietly rewrites.
        run: git diff --exit-code golden/

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.9 is the floor the package claims; 3.12 is what people run.
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install
        working-directory: packages/python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: test
        working-directory: packages/python
        # Includes the §11 golden tests, which compare this port's bytes
        # against the fixtures the TypeScript suite produced.
        run: python -m pytest -q
